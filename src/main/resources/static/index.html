<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>알림 발송 테스트</title>
  <style>
    *{box-sizing:border-box}body{margin:36px auto;padding:0 24px;max-width:1120px;font-family:Arial,"Malgun Gothic",sans-serif;color:#222;line-height:1.65;background:#fff}
    h1{font-size:26px;margin-bottom:6px}h2{font-size:20px;margin:32px 0 12px}p{color:#555}form{border:1px solid #ddd;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
    label{display:block;font-size:14px}input,textarea,select,button{font:inherit}input,textarea{display:block;width:100%;padding:8px;border:1px solid #bbb;border-radius:3px;margin-top:5px}textarea{resize:vertical;min-height:80px}.wide{grid-column:1/-1}
    button{border:1px solid #aaa;background:#f6f6f6;padding:7px 15px;border-radius:3px;cursor:pointer}button.primary{background:#285bb3;color:white;border-color:#285bb3}button:disabled{opacity:.5;cursor:wait}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.note{font-size:13px;color:#666}.result{border-left:3px solid #aaa;background:#fafafa;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:55px}
    .error{color:#aa2525}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #ddd;padding:12px 9px;vertical-align:top}th{background:#f7f7f7;font-weight:600}td.message{max-width:230px;overflow-wrap:anywhere}.status{font-family:Consolas,monospace;font-size:13px}.SENT{color:#19733d}.FAILED{color:#b52d2d}.RETRY_WAIT{color:#976200}code{font-family:Consolas,monospace}details{font-size:12px;max-width:240px}details p{margin:6px 0}
    footer{border-top:1px solid #ddd;margin:30px 0;padding-top:14px;font-size:13px;color:#666}@media(max-width:650px){body{padding:0 14px;margin:20px auto}form{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <h1>알림 발송 테스트</h1>
  <p>요청은 먼저 접수하고, 발송 결과는 아래에서 확인한다.</p>
  <form id="send-form">
    <label>받는 사람<input name="recipient" value="test-user" maxlength="80" required></label>
    <label>발송 지연 (ms)<input name="demoDelayMs" type="number" min="0" max="2000" value="1500" required></label>
    <label class="wide">메시지<textarea name="message" maxlength="500" required>주문이 접수되었습니다.</textarea></label>
    <label>처음 몇 번 실패할지<input name="demoFailures" type="number" min="0" max="10" value="0" required></label>
    <p class="note">0: 바로 성공 · 2: 세 번째에 성공 · 3 이상: 최종 실패<br>총 3번 시도하며 재시도 간격은 1초, 2초다.</p>
    <div class="actions wide"><button class="primary" type="submit">비동기 접수</button><button id="sync" type="button">동기 발송 비교</button><span class="note">실제 문자나 이메일은 발송하지 않는다.</span></div>
  </form>
  <h2>요청 결과</h2>
  <div id="result" class="result" role="status">아직 요청하지 않았습니다.</div>
  <h2>최근 알림</h2>
  <div class="actions"><button id="refresh" type="button">새로고침</button><span id="queue" class="note"></span><span class="note">1초마다 갱신 · 최근 50개</span></div>
  <p id="connection" class="note" role="status"></p>
  <div class="table-wrap"><table><thead><tr><th>접수 시간</th><th>받는 사람</th><th>메시지</th><th>상태</th><th>시도</th><th>상세</th></tr></thead><tbody id="rows"><tr><td colspan="6">불러오는 중...</td></tr></tbody></table></div>
  <footer>단일 워커 실습용 · SENT는 테스트 발송기에서 성공했다는 뜻이다. 동기 비교 요청은 목록에 저장하지 않는다.</footer>
  <script src="/app.js"></script>
</body>
</html>
